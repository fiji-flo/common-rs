[package]
name = "tracing-tower-mozlog"
description = "Support for tracing in Tower/Axum apps that target Mozilla's MozLog"
license = "MPL-2.0"
version = "0.1.0"
edition = "2024"
documentation = "https://docs.rs/tracing-tower-mozlog"
repository = "https://github.com/mozilla-services/common-rs"
homepage = "https://github.com/mozilla-services/common-rs/tree/master/tracing-tower-mozlog"
resolver = "3"

[dependencies]
gethostname = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-bunyan-formatter = "0.3"
tracing-subscriber = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-layer = "0.3"
tower-service = "0.3"
http = "1"
http-body = "1.0"
pin-project-lite = "0.2"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
maplit = "1"
pretty_assertions = "1"
jsonschema = "0.31"
